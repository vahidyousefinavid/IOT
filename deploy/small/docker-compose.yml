# Lean single-server stack for small installs (one home, one machine, or a
# shared VPS): PostgreSQL + Redis + API with the MQTT broker embedded.
# ~250 MB RAM in total, with hard memory limits so it cannot starve
# neighbouring services. For large fleets use the root docker-compose.yml (EMQX).
#
#   cd deploy/small && cp ../../.env.example .env && sh ../../scripts/gen-secrets.sh >> .env
#   docker compose up -d
name: hooshban

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30", "-c", "work_mem=2MB"]
    environment:
      POSTGRES_USER: hooshban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: hooshban
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hooshban"]
      interval: 5s
      retries: 20
    mem_limit: 256m
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes",
              "--maxmemory", "32mb", "--maxmemory-policy", "noeviction"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 64m
    networks: [internal]

  api:
    image: ${API_IMAGE:-hooshban-api:local}
    build:
      context: ../../backend
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://hooshban:${POSTGRES_PASSWORD}@postgres:5432/hooshban?sslmode=disable&pool_max_conns=10
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      MQTT_EMBEDDED_ADDR: ":1883"
      MQTT_URL: tcp://127.0.0.1:1883
      MQTT_CORE_PASSWORD: ${MQTT_CORE_PASSWORD}
      INTERNAL_TOKEN: ${INTERNAL_TOKEN}
      JWT_ED25519_SEED: ${JWT_ED25519_SEED}
      DEVICE_PEPPER: ${DEVICE_PEPPER}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRACKER_GT06_ADDR: ":5023"
      TRACKER_H02_ADDR: ":5013"
    ports:
      - "${API_PORT:-8080}:8080"      # app API (put HTTPS in front when a domain is available)
      - "${MQTT_PORT:-1883}:1883"     # devices (MQTT)
      - "${GT06_PORT:-5023}:5023"     # GPS trackers, GT06
      - "${H02_PORT:-5013}:5013"      # GPS trackers, H02
    read_only: true
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    mem_limit: 160m
    networks: [internal]

networks:
  internal:

volumes:
  pgdata:
  redisdata:
